syntax = "proto3";

package ua.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/any.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "noah/gen/go/ua/v1;uav1";
option java_multiple_files = true;
option java_outer_classname = "UASServiceProto";
option java_package = "com.airdb.apigw.v1";

service UASService {
  option (google.api.default_host) = "apigw.airdb.com";
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {description: "Describe a User-Agent record"};

  // Describe a User-Agent record.
  rpc UASService(UASRequest) returns (UASResponse) {
    option (google.api.http) = {
      post: "/v1/ua/{user_agent=*}"
      body: "payload"
      response_body: "data"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "ua_UASService"
      summary: "Describe a User-Agent record"
      description: "Contract only: no corresponding HTTP route is registered in Noah. This operation is marked deprecated to distinguish it from implemented HTTP endpoints."
      deprecated: true
      responses: {
        key: "200"
        value: {description: "Request processed; see the operation description for current handler behavior."}
      }
    };

    option (google.api.method_signature) = "user_agent";
  }
}

message UASRequest {
  // HTTP User-Agent header value.
  string user_agent = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "HTTP User-Agent header value."
      example: "\"Mozilla/5.0 (X11; Linux x86_64)\""
    },
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // Legacy extension payload. Normal HTTP requests send business fields directly in the JSON body; omit this field.
  map<string, google.protobuf.Any> payload = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Legacy extension payload. Normal HTTP requests send business fields directly in the JSON body; omit this field."
    example: "{}"
  }];
}

message UASResponse {
  // Legacy response extension; current direct HTTP handlers do not populate this field.
  google.protobuf.Any data = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Legacy response extension; current direct HTTP handlers do not populate this field."
    example: "{}"
  }];
  // Application status; its meaning depends on the operation.
  string status = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Application status; its meaning depends on the operation."
    example: "\"ok\""
  }];
}
