syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "common/v1/http.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "noah/gen/go/user/v1;systemv1";
option java_multiple_files = true;
option java_outer_classname = "UserServiceProto";
option java_package = "com.airdb.apigw.v1";

service UserService {
  option (google.api.default_host) = "apigw.airdb.com";
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {description: "User API keys."};

  // Describe a user key operation.
  rpc UserService(UserKeyRequest) returns (UserKeyResponse) {
    option (google.api.http) = {
      post: "/v1/user/{name=*}"
      body: "payload"
      response_body: "data"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "user_UserService"
      summary: "Describe a user key operation"
      description: "Legacy contract only: this templated route is not registered. Current user/key handlers are registered individually under /v1/user and /v1/user/key. This operation is marked deprecated to distinguish it from implemented HTTP endpoints."
      deprecated: true
      responses: {
        key: "200"
        value: {description: "Request processed; see the operation description for current handler behavior."}
      }
    };

    option (google.api.method_signature) = "name";
  }

  // Get key placeholder.
  rpc GetKey(google.protobuf.Empty) returns (noah.common.v1.TextResponse) {
    option (google.api.http) = {
      get: "/v1/user/key"
      response_body: "data"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get key placeholder"
      description: "Currently returns a fixed string. No key lookup is implemented."
      produces: "text/plain"
      responses: {
        key: "200"
        value: {
          description: "Successful response from the current HTTP handler."
          examples: {
            key: "text/plain"
            value: "get key"
          }
        }
      }
    };
  }

  // List API keys.
  rpc ListKeys(google.protobuf.Empty) returns (noah.common.v1.ListResponse) {
    option (google.api.http) = {
      get: "/v1/user/key/list"
      response_body: "data"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List API keys"
      description: "Returns a bare array, fixed limit=10 and offset=0. JSON includes the stored Token field; the example token is redacted and is not a usable key."
      produces: "application/json"
      responses: {
        key: "200"
        value: {
          description: "Successful response from the current HTTP handler."
          examples: {
            key: "application/json"
            value: "[{\"ID\": 1, \"CreatedAt\": \"2026-11-21T08:00:00Z\", \"UpdatedAt\": \"2026-11-21T08:00:00Z\", \"DeletedAt\": null, \"Title\": \"example\", \"Vendor\": \"openai\", \"Token\": \"<redacted-example>\"}]"
          }
        }
      }
    };
  }
}

message UserKeyRequest {
  // Resource name or upstream operation path; see the operation description.
  string name = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Resource name or operation name; see the operation description."
      example: "\"example\""
    },
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];

  // Legacy extension payload. Normal HTTP requests send business fields directly in the JSON body; omit this field.
  map<string, google.protobuf.Any> payload = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Legacy extension payload. Normal HTTP requests send business fields directly in the JSON body; omit this field."
    example: "{}"
  }];
}

message UserKeyResponse {
  // Legacy response extension; current direct HTTP handlers do not populate this field.
  google.protobuf.Any data = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Legacy response extension; current direct HTTP handlers do not populate this field."
    example: "{}"
  }];
  // Application status; its meaning depends on the operation.
  string status = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Application status; its meaning depends on the operation."
    example: "\"ok\""
  }];
}
