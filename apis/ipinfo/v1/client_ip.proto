syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "common/v1/http.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "noah/gen/go/ipinfo/v1;ipinfov1";
option java_multiple_files = true;
option java_outer_classname = "IpdbClientIpProto";
option java_package = "com.airdb.apigw.v1";

service IpdbClientIpService {
  option (google.api.default_host) = "apigw.airdb.com";
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {description: "Client IP records and ISP metadata."};

  // Create a client IP record.
  rpc IpdbClientIpService(IpdbClientIpRequest) returns (IpdbClientIpResponse) {
    option (google.api.http) = {
      post: "/v1/ipdb/clientip/create"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "ipinfo_IpdbClientIpService"
      summary: "Create a client IP record"
      description: "Stores client IP and ISP metadata. The handler also checks whether the address belongs to a known datacenter. Success is plain text."
      produces: "text/plain"
      responses: {
        key: "200"
        value: {
          description: "Record stored successfully."
          schema: {
            json_schema: {type: STRING}
          }
          examples: {
            key: "text/plain"
            value: "create client ip success"
          }
        }
      }
    };

    option (google.api.method_signature) = "ip";
  }

  // Get clientip placeholder.
  rpc GetClientIp(google.protobuf.Empty) returns (noah.common.v1.TextResponse) {
    option (google.api.http) = {
      get: "/v1/ipdb/clientip"
      response_body: "data"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get clientip placeholder"
      description: "Currently returns the literal string get user. No lookup is implemented."
      produces: "text/plain"
      responses: {
        key: "200"
        value: {
          description: "Successful response from the current HTTP handler."
          examples: {
            key: "text/plain"
            value: "get user"
          }
        }
      }
    };
  }

  // List clientip records.
  rpc ListClientIp(google.protobuf.Empty) returns (noah.common.v1.ListResponse) {
    option (google.api.http) = {
      get: "/v1/ipdb/clientip/list"
      response_body: "data"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List clientip records"
      description: "Returns a bare array, fixed limit=10 and offset=0. No query pagination."
      produces: "application/json"
      responses: {
        key: "200"
        value: {
          description: "Successful response from the current HTTP handler."
          examples: {
            key: "application/json"
            value: "[{\"ID\": 1, \"CreatedAt\": \"2026-11-21T08:00:00Z\", \"UpdatedAt\": \"2026-11-21T08:00:00Z\", \"DeletedAt\": null, \"Ip\": \"203.0.113.10\", \"IspDomain\": \"example.net\", \"IspName\": \"Example ISP\", \"IpCity\": \"Singapore\", \"Cnt\": 1, \"IsDataCenter\": false}]"
          }
        }
      }
    };
  }
}

// JSON body accepted by the direct HTTP handler.
message IpdbClientIpRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {example: "{\"ip\": \"203.0.113.10\", \"isp_domain\": \"example.net\", \"isp_name\": \"Example ISP\", \"ip_city\": \"Singapore\", \"cnt\": \"1\"}"};
  // IP address in textual form.
  string ip = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "IP address in textual form."
      example: "\"203.0.113.10\""
    },
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // Legacy extension payload. Normal HTTP requests send business fields directly in the JSON body; omit this field.
  map<string, google.protobuf.Any> payload = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Legacy extension payload. Normal HTTP requests send business fields directly in the JSON body; omit this field."
    example: "{}"
  }];

  // ISP domain name.
  string isp_domain = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "ISP domain name."
    example: "\"example.net\""
  }];
  // ISP display name.
  string isp_name = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "ISP display name."
    example: "\"Example ISP\""
  }];
  // City reported for the client IP.
  string ip_city = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "City reported for the client IP."
    example: "\"Singapore\""
  }];
  // Observed request count; protobuf JSON represents int64 values as strings.
  int64 cnt = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Observed request count; protobuf JSON represents int64 values as strings."
    example: "\"1\""
  }];
}

message IpdbClientIpResponse {
  // Legacy response extension; current direct HTTP handlers do not populate this field.
  google.protobuf.Any data = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Legacy response extension; current direct HTTP handlers do not populate this field."
    example: "{}"
  }];
  // Application status; its meaning depends on the operation.
  string status = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Application status; its meaning depends on the operation."
    example: "\"ok\""
  }];
}
