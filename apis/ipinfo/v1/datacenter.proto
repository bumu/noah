syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "common/v1/http.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "noah/gen/go/user/v1;systemv1";
option java_multiple_files = true;
option java_outer_classname = "IPDataCenterServiceProto";
option java_package = "com.airdb.apigw.v1";

service IPDataCenterService {
  option (google.api.default_host) = "apigw.airdb.com";
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {description: "Datacenter IP ranges."};

  // Create a datacenter IP range.
  rpc IPDataCenterService(IPDataCenterRequest) returns (IPDataCenterResponse) {
    option (google.api.http) = {
      post: "/v1/ipdb/datacenter/create"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      operation_id: "ipinfo_IPDataCenterService"
      summary: "Create a datacenter IP range"
      description: "Stores a datacenter range. Supply both dotted IPv4 addresses and their unsigned integer forms; the handler does not calculate these values. Success is plain text."
      produces: "text/plain"
      responses: {
        key: "200"
        value: {
          description: "Record stored successfully."
          schema: {
            json_schema: {type: STRING}
          }
          examples: {
            key: "text/plain"
            value: "create datacenter"
          }
        }
      }
    };

    option (google.api.method_signature) = "name";
  }

  // Get datacenter placeholder.
  rpc GetDatacenter(google.protobuf.Empty) returns (noah.common.v1.TextResponse) {
    option (google.api.http) = {
      get: "/v1/ipdb/datacenter"
      response_body: "data"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get datacenter placeholder"
      description: "Currently returns the literal string get user. No lookup is implemented."
      produces: "text/plain"
      responses: {
        key: "200"
        value: {
          description: "Successful response from the current HTTP handler."
          examples: {
            key: "text/plain"
            value: "get user"
          }
        }
      }
    };
  }

  // List datacenter records.
  rpc ListDatacenter(google.protobuf.Empty) returns (noah.common.v1.ListResponse) {
    option (google.api.http) = {
      get: "/v1/ipdb/datacenter/list"
      response_body: "data"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List datacenter records"
      description: "Returns a bare array, fixed limit=10 and offset=0. No query pagination."
      produces: "application/json"
      responses: {
        key: "200"
        value: {
          description: "Successful response from the current HTTP handler."
          examples: {
            key: "application/json"
            value: "[{\"ID\": 1, \"CreatedAt\": \"2026-11-21T08:00:00Z\", \"UpdatedAt\": \"2026-11-21T08:00:00Z\", \"DeletedAt\": null, \"Name\": \"example-datacenter\", \"Domain\": \"example.net\", \"IpStart\": \"203.0.113.0\", \"IpEnd\": \"203.0.113.255\", \"IpStartInt\": 3405803776, \"IpEndInt\": 3405804031}]"
          }
        }
      }
    };
  }
}

// JSON body accepted by the direct HTTP handler.
message IPDataCenterRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {example: "{\"name\": \"example-datacenter\", \"domain\": \"example.net\", \"ip_start\": \"203.0.113.0\", \"ip_end\": \"203.0.113.255\", \"ip_start_int\": 3405803776, \"ip_end_int\": 3405804031}"};
  // Resource name or operation name; see the operation description.
  string name = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Resource name or operation name; see the operation description."
      example: "\"example-datacenter\""
    },
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];
  // Legacy extension payload. Normal HTTP requests send business fields directly in the JSON body; omit this field.
  map<string, google.protobuf.Any> payload = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Legacy extension payload. Normal HTTP requests send business fields directly in the JSON body; omit this field."
    example: "{}"
  }];

  // Datacenter provider domain.
  string domain = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Datacenter provider domain."
    example: "\"example.net\""
  }];
  // First IPv4 address in the range.
  string ip_start = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "First IPv4 address in the range."
    example: "\"203.0.113.0\""
  }];
  // Last IPv4 address in the range.
  string ip_end = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Last IPv4 address in the range."
    example: "\"203.0.113.255\""
  }];
  // Unsigned integer representation of ip_start.
  uint32 ip_start_int = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Unsigned integer representation of ip_start."
    example: "3405803776"
  }];
  // Unsigned integer representation of ip_end.
  uint32 ip_end_int = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Unsigned integer representation of ip_end."
    example: "3405804031"
  }];
}

message IPDataCenterResponse {
  // Legacy response extension; current direct HTTP handlers do not populate this field.
  google.protobuf.Any data = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Legacy response extension; current direct HTTP handlers do not populate this field."
    example: "{}"
  }];
  // Application status; its meaning depends on the operation.
  string status = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Application status; its meaning depends on the operation."
    example: "\"ok\""
  }];
}
